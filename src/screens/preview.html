<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>무한항로 화면 프리뷰</title>
    <style>
      html, body { margin: 0; background: #05070a; overflow-x: hidden; }
      #preview-root { height: 100vh; height: 100dvh; }
      #preview-tabs {
        position: fixed; z-index: 9; top: 8px; right: 8px; left: 8px;
        display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px;
        font: 11px ui-monospace, monospace;
      }
      #preview-tabs button {
        padding: 6px 10px; border: 1px solid #263b48; background: #0c141c;
        color: #93a7b3; cursor: pointer; font: inherit;
      }
      #preview-tabs button[aria-pressed='true'] { border-color: #69e6e8; color: #69e6e8; }
      @media (max-width: 640px) {
        #preview-tabs { left: 105px; right: 4px; gap: 2px; flex-wrap: nowrap; }
        #preview-tabs button { padding: 5px; font-size: 9px; }
      }
    </style>
  </head>
  <body>
    <nav id="preview-tabs"></nav>
    <div id="preview-root"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
